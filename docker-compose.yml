services:
  auditor:
    build: .
    image: cybersecurity-auditor:latest
    ports:
      - "8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - chromadb:/app/.chromadb          # framework embeddings
      - auditor_cache:/root/.cache/auditor  # KEV / EPSS / ATT&CK STIX / audit history
    restart: unless-stopped

volumes:
  chromadb:
  auditor_cache:
