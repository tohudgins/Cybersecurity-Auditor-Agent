[project]
name = "cybersecurity-auditor"
version = "0.1.0"
description = "Multi-agent cybersecurity auditing assistant — answers compliance questions and evaluates user systems against NIST, CIS, OWASP, MITRE ATT&CK, and CompTIA standards."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tyler Hudgins" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-chroma>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "chromadb>=1.0,<2",
    "openai>=2.0,<3",
    "pypdf>=4.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
    "streamlit>=1.38.0",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pre-commit>=3.7.0",
    "ruff>=0.6.0",
]
# Only bandit lives here — it's tiny and import-clean. The other Python scanners
# are heavy apps whose pins conflict with the core stack (Semgrep → opentelemetry
# /click; Checkov → boto3==x.y.z; Prowler → pydantic v1). They are only ever
# invoked as CLIs via subprocess, so they're pipx-isolated, NOT venv deps:
#   pipx install semgrep
#   pipx install checkov
#   pipx install prowler --python python3.12
scanners = [
    "bandit>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # line length already enforced; allow Depends()-style defaults

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]  # sys.path manipulation must precede imports
"tests/*" = ["E402"]
